<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middle C Piano Path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&family=Noto+Music&display=swap">
<style>
:root{
  --bg:#F4F2EC; --bg-2:#EBE8E0; --surface:#FBFAF7; --line:#D9D5CB;
  --ink:#1C1A20; --ink-2:#5E5B66; --ink-3:#8E8A94;
  --felt:#B23A3E; --felt-soft:#F2D9D9; --brass:#9C7B3A; --brass-soft:#F0E6CF;
  --good:#2E7D4F; --good-soft:#D8EEDF; --bad:#B23A3E; --bad-soft:#F5DCDC;
  --white-key:#FBFAF6; --white-key-edge:#CFCBC0; --black-key:#221F26; --black-key-edge:#4A4552;
  --hint:#E7D3A3; --shadow:0 1px 2px rgba(28,26,32,.06),0 8px 24px rgba(28,26,32,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17161B; --bg-2:#1F1E24; --surface:#232229; --line:#3A3841;
    --ink:#ECE8DF; --ink-2:#B4AFA6; --ink-3:#7E7A83;
    --felt:#D1555A; --felt-soft:#3B2426; --brass:#C9A45B; --brass-soft:#3A3122;
    --good:#5DBB84; --good-soft:#1F3A2B; --bad:#D1555A; --bad-soft:#3B2426;
    --white-key:#E9E5DA; --white-key-edge:#B9B4A8; --black-key:#101014; --black-key-edge:#3A3841;
    --hint:#B5924A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#17161B; --bg-2:#1F1E24; --surface:#232229; --line:#3A3841;
  --ink:#ECE8DF; --ink-2:#B4AFA6; --ink-3:#7E7A83;
  --felt:#D1555A; --felt-soft:#3B2426; --brass:#C9A45B; --brass-soft:#3A3122;
  --good:#5DBB84; --good-soft:#1F3A2B; --bad:#D1555A; --bad-soft:#3B2426;
  --white-key:#E9E5DA; --white-key-edge:#B9B4A8; --black-key:#101014; --black-key-edge:#3A3841;
  --hint:#B5924A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:22px}
.brand h1 em{font-style:italic;color:var(--felt)}
.brand .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hstats{display:flex;align-items:center;gap:18px;font-size:14px;color:var(--ink-2)}
.hstats .bar{width:140px;height:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hstats .bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .4s}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-3);color:var(--ink)}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:0}
nav{border-right:1px solid var(--line);background:var(--bg-2);overflow-y:auto;padding:16px 0}
nav .sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:10px 20px 4px}
nav button.lesson{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 20px;font-size:15px;color:var(--ink-2)}
nav button.lesson:hover{background:var(--bg);color:var(--ink)}
nav button.lesson.active{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--felt)}
nav .num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3)}
nav .lesson.active .num{color:var(--felt)}
nav .done{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--good)}
nav .lesson.is-done .done{border-color:var(--good);background:var(--good-soft)}
nav .score{font-size:11px;color:var(--ink-3);font-family:"JetBrains Mono",monospace}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;overflow-y:auto;padding:28px 36px 20px}
.stage-inner{max-width:760px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}
.stage h2{font-size:36px;margin-bottom:8px}
.lede{color:var(--ink-2);font-size:18px;max-width:62ch;margin:0 0 18px}
.prose{max-width:66ch}
.prose p{margin:0 0 12px}
.prose kbd{font-family:"JetBrains Mono",monospace;font-size:13px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
.prose .note{font-family:"JetBrains Mono",monospace;font-weight:500}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.figure svg{max-width:100%;height:auto}
.figure .cap{font-size:14px;color:var(--ink-2);max-width:32ch}

/* Task panel */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 24px;margin-top:18px}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.task-head .title{font-weight:600}
.task-head .prog{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-3)}
.prompt{display:flex;align-items:center;gap:22px;min-height:120px;flex-wrap:wrap}
.big{font-family:Fraunces,serif;font-size:64px;line-height:1;font-weight:700;min-width:120px;text-align:center}
.big small{display:block;font-family:"Source Sans 3",sans-serif;font-size:14px;font-weight:400;color:var(--ink-2);margin-top:6px;letter-spacing:.04em}
.finger{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--brass-soft);color:var(--brass);font-family:"JetBrains Mono",monospace;font-size:20px;border:1.5px solid var(--brass)}
.fb{margin-top:12px;min-height:24px;font-size:15px;color:var(--ink-2)}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:15px}
.btn:hover{background:var(--felt)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--ink-3);background:var(--bg-2)}
.result{display:grid;grid-template-columns:repeat(3,auto);gap:22px;align-items:end;margin:8px 0 4px}
.result .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.result .v{font-family:Fraunces,serif;font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.beats{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.beat{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink-3);font-family:"JetBrains Mono",monospace}
.beat.half{width:52px;border-radius:13px}
.beat.now{border-color:var(--brass);background:var(--brass-soft)}
.beat.hit{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.beat.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:"JetBrains Mono",monospace;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--bg)}
.chip.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.chip.next{border-color:var(--brass);background:var(--brass-soft);color:var(--brass)}

/* Piano */
.piano-wrap{border-top:1px solid var(--line);background:var(--bg-2);padding:10px 24px 14px}
.piano-bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:8px;gap:12px;flex-wrap:wrap}
.piano-bar .now{font-family:"JetBrains Mono",monospace;color:var(--ink);min-width:80px}
.piano-bar label{display:flex;align-items:center;gap:6px}
.piano-scroll{overflow-x:auto}
.piano{position:relative;height:150px;min-width:720px;display:flex;user-select:none;-webkit-user-select:none}
.key{position:relative;border:1px solid var(--white-key-edge);border-top:0;background:var(--white-key);flex:1;border-radius:0 0 5px 5px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;gap:2px;color:#6B6870;transition:background .08s}
.key .nm{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.55}
.key .kb{font-family:"JetBrains Mono",monospace;font-size:10px;padding:0 4px;border:1px solid rgba(0,0,0,.18);border-radius:3px;opacity:.7}
.key.c .nm{opacity:1;font-weight:600;color:#1C1A20}
.key.black{position:absolute;top:0;width:calc(100%/22*.62);height:60%;background:var(--black-key);border:1px solid var(--black-key-edge);border-top:0;border-radius:0 0 4px 4px;z-index:2;color:#CFCBC0;margin-left:calc(100%/22*-.31);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.key.black .kb{border-color:rgba(255,255,255,.3)}
.key.black .nm{display:none}
.key.hint{background:var(--hint)} .key.black.hint{background:#7A5F2A}
.key.hint .fbadge{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--felt);color:#fff;font-family:"JetBrains Mono",monospace;font-size:12px;display:grid;place-items:center}
.key.black.hint .fbadge{top:auto;bottom:-30px;background:var(--felt)}
.key.down{background:#D8D4C8;transform:translateY(1px)} .key.black.down{background:#3A3641}
.key.ok{background:#BFE3CB!important} .key.black.ok{background:#3C8A5A!important}
.key.err{background:#F0BFC0!important} .key.black.err{background:#8E3A3E!important}
.key.hint.down{background:#D9BE7F}

/* Staff */
.staff-box{display:inline-block}
.staff-box svg{display:block}
.staff-box .clef{font-family:"Noto Music","Segoe UI Symbol","Apple Symbols",serif}

.toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav{display:none}
  nav.open{display:block;position:fixed;inset:0;top:0;z-index:20}
  .stage{padding:20px}
  .stage h2{font-size:30px}
  .hstats .bar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Middle <em>C</em></h1>
    <span class="tag">Piano for beginners</span>
  </div>
  <div class="hstats">
    <span id="progText">0 of 10 lessons</span>
    <div class="bar"><i id="progBar"></i></div>
    <button class="ghost" id="menuBtn">Lessons</button>
    <button class="ghost" id="resetBtn" title="Clear saved progress">Reset progress</button>
  </div>
</header>

<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="stage"><div class="stage-inner" id="stage"></div></div>
    <div class="piano-wrap">
      <div class="piano-bar">
        <div>Playing: <span class="now" id="nowNote">—</span></div>
        <div>Keys <kbd class="mono">A</kbd>–<kbd class="mono">'</kbd> play the octave marked on the keys · <kbd class="mono">Z</kbd> / <kbd class="mono">X</kbd> move it down / up</div>
        <label><input type="checkbox" id="showNames" checked> Show note names</label>
      </div>
      <div class="piano-scroll"><div class="piano" id="piano"></div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Music helpers ---------- */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS={'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'};
const pc=m=>NAMES[m%12];
const octv=m=>Math.floor(m/12)-1;
const nameOf=m=>pc(m)+octv(m);
const isBlack=m=>pc(m).includes('#');
const N=(s)=>{ // 'C4' -> 60
  const m=s.match(/^([A-G])(#?)(-?\d)$/); const i=NAMES.indexOf(m[1]+m[2]); return (parseInt(m[3])+1)*12+i;
};
const LOW=N('C3'), HIGH=N('C6');

/* ---------- Audio ---------- */
let ctx=null, master=null; const voices=new Map();
function audio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.5; const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);} if(ctx.state==='suspended') ctx.resume(); return ctx; }
function noteOn(m,vel=0.8){
  const c=audio(); if(voices.has(m)) noteOff(m,true);
  const f=440*Math.pow(2,(m-69)/12), t=c.currentTime;
  const g=c.createGain(); const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(Math.min(9000,f*8),t); lp.frequency.exponentialRampToValueAtTime(Math.max(800,f*2),t+1.2);
  g.connect(lp); lp.connect(master);
  const parts=[[1,1],[2,.45],[3,.22],[4,.1],[5,.05],[6,.03]]; const oscs=[];
  parts.forEach(([h,a])=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.value=f*h; const og=c.createGain(); og.gain.value=a*(h>1?Math.min(1,2000/(f*h)):1); o.connect(og); og.connect(g); o.start(t); oscs.push(o); });
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+0.008); g.gain.exponentialRampToValueAtTime(vel*0.35,t+0.5); g.gain.exponentialRampToValueAtTime(0.0008,t+3.2);
  const stopAt=t+3.3; oscs.forEach(o=>o.stop(stopAt));
  voices.set(m,{g,oscs});
}
function noteOff(m,fast){
  const v=voices.get(m); if(!v) return; voices.delete(m); const t=ctx.currentTime;
  v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t); v.g.gain.exponentialRampToValueAtTime(0.0008,t+(fast?0.03:0.25)); v.oscs.forEach(o=>{try{o.stop(t+0.3)}catch(e){}});
}
function click(strong){ const c=audio(); const t=c.currentTime; const o=c.createOscillator(); o.type='square'; o.frequency.value=strong?1400:1000; const g=c.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06); }

/* ---------- Staff drawing ---------- */
function staffSVG(clef, midis, opts={}){
  const w=opts.width||220, sp=12, top=30, lines=5; const h=top*2+sp*4;
  const bottomY=top+sp*4;
  const base = clef==='treble' ? 30 : 18; // diatonic number of bottom line: E4=30, G2=18
  const dn=m=>{ const l='CDEFGAB'.indexOf(pc(m)[0]); return octv(m)*7+l; };
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${clef} staff">`;
  for(let i=0;i<lines;i++) s+=`<line x1="10" x2="${w-10}" y1="${top+i*sp}" y2="${top+i*sp}" stroke="currentColor" stroke-width="1"/>`;
  const glyph = clef==='treble' ? '&#x1D11E;' : '&#x1D122;';
  const gy = clef==='treble' ? bottomY+2 : top+sp*3-1;
  s+=`<text class="clef" x="14" y="${gy}" font-size="${clef==='treble'?58:40}" fill="currentColor">${glyph}</text>`;
  const step=(w-70)/(midis.length+0.5);
  midis.forEach((m,i)=>{
    const pos=dn(m)-base; const y=bottomY-pos*sp/2; const x=64+step*(i+0.6);
    for(let p=-2;p>=pos;p-=2) s+=`<line x1="${x-11}" x2="${x+11}" y1="${bottomY-p*sp/2}" y2="${bottomY-p*sp/2}" stroke="currentColor"/>`;
    for(let p=10;p<=pos;p+=2) s+=`<line x1="${x-11}" x2="${x+11}" y1="${bottomY-p*sp/2}" y2="${bottomY-p*sp/2}" stroke="currentColor"/>`;
    const cur = i===(opts.cursor??-1);
    const col = cur?'var(--felt)':(i<(opts.cursor??-1)?'var(--ink-3)':'currentColor');
    if(isBlack(m)) s+=`<text x="${x-20}" y="${y+5}" font-size="16" fill="${col}" font-family="Noto Music,serif">&#x266F;</text>`;
    s+=`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="4.6" transform="rotate(-20 ${x} ${y})" fill="${col}"/>`;
    const up = pos<4; s+=`<line x1="${up?x+6:x-6}" x2="${up?x+6:x-6}" y1="${y}" y2="${up?y-28:y+28}" stroke="${col}" stroke-width="1.3"/>`;
    if(opts.labels) s+=`<text x="${x}" y="${h-4}" text-anchor="middle" font-size="11" fill="${col}" font-family="JetBrains Mono,monospace">${opts.labels[i]??''}</text>`;
  });
  return s+'</svg>';
}

/* ---------- Songs ---------- */
const seq=(str)=>str.trim().split(/\s+/).map(t=>{const [n,d]=t.split(':');return {n:N(n),d:parseFloat(d||1)}});
const SONGS={
  mary:{title:'Mary Had a Little Lamb',bpm:100,notes:seq('E4 D4 C4 D4 E4 E4 E4:2 D4 D4 D4:2 E4 G4 G4:2 E4 D4 C4 D4 E4 E4 E4 E4 D4 D4 E4 D4 C4:2')},
  twinkle:{title:'Twinkle, Twinkle, Little Star',bpm:100,notes:seq('C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2')},
  ode:{title:'Ode to Joy',bpm:110,notes:seq('E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:.5 C4:2')},
  jingle:{title:'Jingle Bells',bpm:120,notes:seq('E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:.5 E4:4 F4 F4 F4:1.5 F4:.5 F4 E4 E4 E4:.5 E4:.5 E4 D4 D4 E4 D4:2 G4:2 E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:.5 E4:4 F4 F4 F4:1.5 F4:.5 F4 E4 E4 E4:.5 E4:.5 G4 G4 F4 D4 C4:4')},
  birthday:{title:'Happy Birthday',bpm:100,notes:seq('C4:.75 C4:.25 D4 C4 F4 E4:2 C4:.75 C4:.25 D4 C4 G4 F4:2 C4:.75 C4:.25 C5 A4 F4 E4 D4 A#4:.75 A#4:.25 A4 F4 G4 F4:2')},
};

/* ---------- Lessons ---------- */
const SCALE_C=['C4','D4','E4','F4','G4','A4','B4','C5','B4','A4','G4','F4','E4','D4','C4'];
const SCALE_F=[1,2,3,1,2,3,4,5,4,3,2,1,3,2,1];
const fig=(svg,cap)=>`<div class="figure"><div class="staff-box">${svg}</div><div class="cap">${cap}</div></div>`;

const LESSONS=[
{id:'keyboard',title:'Meet the keyboard',group:'Foundations',lede:'Before any notes, learn to find your way around by feel: the black keys come in groups of two and three, and every white key sits in a fixed spot relative to them.',
 steps:[
  {type:'read',html:`<p>Look at the piano below. The black keys are not evenly spaced — they alternate in <strong>groups of two</strong> and <strong>groups of three</strong>. That pattern repeats every twelve keys, and it is how pianists find any note without looking at labels.</p>
  <p>The white key just to the <strong>left of every group of two black keys is C</strong>. There are three of them on this keyboard, plus one at the far right. The C nearest the middle of a full-size piano is called <span class="note">middle C</span> — it's the one marked <span class="note">C4</span> here.</p>
  <p>You can play by clicking keys, or with your computer keyboard: the letters printed on the keys show which key to press. Try it, then continue.</p>`},
  {type:'play',title:'Find every C',prompt:'Play each C on the keyboard, from lowest to highest.',targets:['C3','C4','C5','C6'].map(n=>({notes:[N(n)],label:'C',sub:'left of the two black keys',hint:true}))},
  {type:'play',title:'Now find F',prompt:'F sits just left of each group of three black keys. Play all three, low to high — no hints this time.',targets:['F3','F4','F5'].map(n=>({notes:[N(n)],label:'F',sub:'left of the three black keys',hint:false}))},
 ]},
{id:'whites',title:'The seven white notes',group:'Foundations',lede:'The white keys use only seven letters, A through G, then start over. Once you know C, the rest follow in alphabetical order to the right.',
 steps:[
  {type:'read',html:`<p>Starting at C and moving right, the white keys are <span class="note">C D E F G A B</span> — and then C again, one <strong>octave</strong> higher. Moving left, the alphabet runs backwards.</p>
  <p>Two anchors are enough to find anything: <strong>C</strong> is left of the two black keys, <strong>F</strong> is left of the three. D sits between the two black keys; G, A sit inside the group of three; E and B are the white keys on the right edge of each group.</p>
  <p>Say the letter out loud as you play it — it sticks much faster.</p>`},
  {type:'play',title:'Walk up from middle C',prompt:'Play the note shown. The key is highlighted while you learn.',targets:['C4','D4','E4','F4','G4','A4','B4','C5'].map(n=>({notes:[N(n)],label:n[0],hint:true}))},
  {type:'play',title:'Name that key',prompt:'Play the note shown, without hints. Any octave counts.',targets:['G','D','A','F','B','E','C','A','G','F'].map(l=>({pcs:[NAMES.indexOf(l)],label:l,hint:false}))},
 ]},
{id:'fingers',title:'Finger numbers & hand position',group:'Foundations',lede:'Sheet music tells you which finger to use with a number from 1 to 5. Learning them now means every later exercise can show you a proper fingering.',
 steps:[
  {type:'read',html:`<p>Both hands count the same way: <strong>1 is the thumb</strong>, 2 the index finger, 3 the middle, 4 the ring finger, and <strong>5 the little finger</strong>. Hold your hands in front of you with palms down — thumbs are 1, and the numbers run outward.</p>
  <p>Sit tall, elbows a little in front of your body, and let your fingers curve gently as if holding a ball. Play from the fingertip, not the flat of the finger.</p>
  <p>The classic starting shape is <strong>C position</strong>: right-hand thumb on middle C, and fingers 2–5 resting on D, E, F, G. Each finger owns one key, so you can play five notes without moving your hand.</p>`},
  {type:'play',title:'Right hand, C position',prompt:'Play the highlighted key with the finger number shown. Thumb is 1.',targets:[['C4',1],['D4',2],['E4',3],['F4',4],['G4',5],['F4',4],['E4',3],['D4',2],['C4',1]].map(([n,f])=>({notes:[N(n)],label:n[0],finger:f,hint:true}))},
  {type:'play',title:'Right hand, mixed order',prompt:'Same five keys, in a less predictable order. Keep each finger on its own key.',targets:[['E4',3],['C4',1],['G4',5],['D4',2],['F4',4],['C4',1],['E4',3],['G4',5],['C4',1]].map(([n,f])=>({notes:[N(n)],label:n[0],finger:f,hint:true}))},
  {type:'play',title:'Left hand, C position',prompt:'Left hand: little finger (5) on the C below middle C, thumb (1) on G. Play the highlighted key with the finger shown.',targets:[['C3',5],['D3',4],['E3',3],['F3',2],['G3',1],['F3',2],['E3',3],['D3',4],['C3',5]].map(([n,f])=>({notes:[N(n)],label:n[0],finger:f,hint:true}))},
 ]},
{id:'blacks',title:'Sharps and flats',group:'Foundations',lede:'Every black key has two names, depending on which white neighbour you count from. The distance from any key to the very next one is called a half step.',
 steps:[
  {type:'read',html:`<p>A <strong>sharp</strong> (<span class="note">♯</span>) raises a note by one half step — the very next key to the right, black or white. A <strong>flat</strong> (<span class="note">♭</span>) lowers it one half step to the left.</p>
  <p>So the black key between C and D is both <span class="note">C♯</span> and <span class="note">D♭</span>. Which name you use depends on the music's key, but it is the same sound. Notice there is no black key between E and F, or between B and C — those pairs are already a half step apart.</p>
  <p>Black keys are played closer to the back of the keyboard. Let your hand move slightly forward when you reach for one.</p>`},
  {type:'play',title:'Play the sharps',prompt:'Play the black key named. Any octave counts.',targets:['C#','F#','G#','D#','A#'].map(l=>({pcs:[NAMES.indexOf(l)],label:l.replace('#','♯'),sub:'sharp — one key right of '+l[0],hint:true}))},
  {type:'play',title:'Play the flats',prompt:'Same keys, spelled as flats. Find the white note and step one key left.',targets:[['Db','C#'],['Eb','D#'],['Gb','F#'],['Ab','G#'],['Bb','A#']].map(([fl,sh])=>({pcs:[NAMES.indexOf(sh)],label:fl[0]+'♭',sub:'flat — one key left of '+fl[0],hint:false}))},
 ]},
{id:'treble',title:'Reading the treble staff',group:'Reading music',lede:'Written music places notes on five lines. The treble clef, used for the right hand, wraps around the G line — and the rest follows alphabetically.',
 steps:[
  {type:'read',html:`<p>The staff has five lines and four spaces. Each line or space is one white note; going up one step on the staff is going right one white key.</p>
  ${fig(staffSVG('treble',['E4','G4','B4','D5','F5'].map(N),{labels:['E','G','B','D','F'],width:260}),'The five lines, bottom to top: <b>E G B D F</b> — "Every Good Boy Does Fine".')}
  ${fig(staffSVG('treble',['F4','A4','C5','E5'].map(N),{labels:['F','A','C','E'],width:240}),'The four spaces spell <b>F A C E</b>.')}
  ${fig(staffSVG('treble',['C4'].map(N),{labels:['C'],width:160}),'Middle C sits just <em>below</em> the staff on a short extra line called a <b>ledger line</b>.')}
  <p>Reading is a skill of recognition, not calculation. Aim to know a few landmark notes instantly (middle C, the G line, the F at the top) and count from the nearest one.</p>`},
  {type:'play',title:'Play what you see',prompt:'A note appears on the treble staff. Play it in the right octave (C4–F5). Hints on.',staff:'treble',targets:['C4','E4','G4','B4','D5','F5','F4','A4','C5','E5'].map(n=>({notes:[N(n)],hint:true}))},
  {type:'play',title:'Read without help',prompt:'Same range, no hints. Use the landmarks: middle C below, G on the second line.',staff:'treble',targets:['G4','C4','E4','B4','F4','D5','A4','C5','E5','D4','F5','G4'].map(n=>({notes:[N(n)],hint:false}))},
 ]},
{id:'bass',title:'Reading the bass staff',group:'Reading music',lede:'The left hand reads the bass clef, whose two dots surround the F line. Same idea, different landmarks.',
 steps:[
  {type:'read',html:`<p>The bass clef covers the notes below middle C. Its lines, bottom to top, are <b>G B D F A</b> — "Good Boys Do Fine Always" — and its spaces are <b>A C E G</b>, "All Cows Eat Grass".</p>
  ${fig(staffSVG('bass',['G2','B2','D3','F3','A3'].map(N),{labels:['G','B','D','F','A'],width:260}),'Bass-clef lines: <b>G B D F A</b>. The clef\'s two dots sit either side of the F line.')}
  ${fig(staffSVG('bass',['A2','C3','E3','G3'].map(N),{labels:['A','C','E','G'],width:240}),'Bass-clef spaces: <b>A C E G</b>.')}
  ${fig(staffSVG('bass',['C4'].map(N),{labels:['C'],width:160}),'Middle C appears on a ledger line <em>above</em> the bass staff — the same key as the ledger-line C below the treble staff.')}
  <p>Piano music prints both staves together, joined by a brace; the treble on top for the right hand, the bass below for the left.</p>`},
  {type:'play',title:'Play the bass notes',prompt:'Play the note shown, in the octave written. These all sit between C3 and middle C. Hints on.',staff:'bass',targets:['C3','E3','G3','B3','D3','F3','A3','C4'].map(n=>({notes:[N(n)],hint:true}))},
  {type:'play',title:'Bass clef, no hints',prompt:'Read and play. Landmarks: F on the fourth line (between the dots), middle C above the staff.',staff:'bass',targets:['F3','C3','A3','D3','G3','C4','E3','B3','F3','A3'].map(n=>({notes:[N(n)],hint:false}))},
 ]},
{id:'rhythm',title:'Rhythm and counting',group:'Reading music',lede:'Pitch is only half of a note; the other half is how long it lasts. Beginners count out loud, and so will you.',
 steps:[
  {type:'read',html:`<p>Music moves in a steady pulse called the <strong>beat</strong>. In the most common time signature, <span class="note">4/4</span>, beats come in groups of four: <em>one, two, three, four</em>, repeated.</p>
  <p>A <strong>quarter note</strong> lasts one beat. A <strong>half note</strong> lasts two. A <strong>whole note</strong> lasts all four. In the exercise, short circles are quarter notes and long pills are half notes.</p>
  <p>You'll hear four clicks to count you in, then play any key exactly on each marked beat. Hold half notes for two clicks before the next hit. Being early is as wrong as being late — listen, and let the click lead.</p>`},
  {type:'rhythm',title:'Quarter notes',prompt:'Four clicks count you in. Then press any key on every beat, eight times.',bpm:80,pattern:[1,1,1,1,1,1,1,1]},
  {type:'rhythm',title:'Quarters and halves',prompt:'Play on each marked beat. Half notes (long pills) take two beats, so wait for the second click before playing again.',bpm:84,pattern:[1,1,2,1,1,2,2,2]},
 ]},
{id:'scale',title:'The C major scale',group:'Playing',lede:'Eight notes up, eight back down, all white keys — and the first time your thumb has to tuck under to reach.',
 steps:[
  {type:'read',html:`<p>The C major scale is C D E F G A B C. Five fingers cannot cover eight keys, so the right hand uses a <strong>thumb tuck</strong>: play C D E with fingers 1 2 3, then pass the thumb <em>under</em> your middle finger to land on F, and finish F G A B C with 1 2 3 4 5.</p>
  <p>Coming down it reverses: 5 4 3 2 1 on C B A G F, then the middle finger <em>crosses over</em> the thumb to E, and 3 2 1 finishes E D C.</p>
  <p>Go slowly and evenly. The tuck should be quiet and smooth — keep the wrist level and don't let the elbow swing out.</p>`},
  {type:'play',title:'Right hand, ascending and descending',prompt:'Play the highlighted key with the finger shown. Watch for the tuck at F and the cross-over at E.',staff:'treble',targets:SCALE_C.map((n,i)=>({notes:[N(n)],label:n[0],finger:SCALE_F[i],hint:true}))},
  {type:'play',title:'From memory',prompt:'Same scale, up and down, without highlights. Fingering is still shown.',staff:'treble',targets:SCALE_C.map((n,i)=>({notes:[N(n)],label:n[0],finger:SCALE_F[i],hint:false}))},
 ]},
{id:'chords',title:'First chords',group:'Playing',lede:'Three notes played together make a triad. With C, F and G you can accompany hundreds of songs.',
 steps:[
  {type:'read',html:`<p>A <strong>major triad</strong> is three notes stacked in thirds: a root, the note two white keys up, and the one two more above that. Play them together with fingers <span class="note">1 3 5</span> in the right hand.</p>
  ${fig(staffSVG('treble',['C4','E4','G4'].map(N),{labels:['C','E','G'],width:200}),'<b>C major</b>: C – E – G. Thumb on C, middle finger on E, little finger on G.')}
  <p><strong>F major</strong> is F – A – C, and <strong>G major</strong> is G – B – D. Every one of them is skip-a-key, skip-a-key from the root.</p>
  <p>On a computer keyboard, hold all three letters at once. Press them together, not one after another — the exercise waits until all three are down at the same time.</p>`},
  {type:'chord',title:'C, F and G',prompt:'Hold all three highlighted keys together.',targets:[
    {notes:['C4','E4','G4'].map(N),label:'C',sub:'C · E · G',hint:true},
    {notes:['F4','A4','C5'].map(N),label:'F',sub:'F · A · C',hint:true},
    {notes:['G4','B4','D5'].map(N),label:'G',sub:'G · B · D',hint:true},
    {notes:['C4','E4','G4'].map(N),label:'C',sub:'C · E · G',hint:true}]},
  {type:'chord',title:'Chord changes, no hints',prompt:'A common progression: C, F, G, C, then G, F, C. Find each chord yourself.',targets:['C','F','G','C','G','F','C'].map(r=>{const roots={C:['C4','E4','G4'],F:['F4','A4','C5'],G:['G4','B4','D5']};return {notes:roots[r].map(N),label:r,sub:roots[r].map(x=>x[0]).join(' · '),hint:false}})},
 ]},
{id:'songs',title:'Your first songs',group:'Playing',lede:'Everything so far, put to use. Each song shows the next note on the staff and on the keyboard; play at your own pace, then try it with the count.',
 steps:[
  {type:'read',html:`<p>Pick a song. The staff shows the next few notes, the red one is the one to play now. Longer notes are marked with their beat count. You can turn hints off once a tune feels familiar.</p>
  <p>Practising tip: play a song three times slowly rather than once fast. Speed comes on its own once the fingers know where to go.</p>`},
  {type:'song',song:'mary',title:'Mary Had a Little Lamb'},
  {type:'song',song:'twinkle',title:'Twinkle, Twinkle, Little Star'},
  {type:'song',song:'ode',title:'Ode to Joy'},
  {type:'song',song:'birthday',title:'Happy Birthday'},
  {type:'song',song:'jingle',title:'Jingle Bells'},
 ]},
];

/* ---------- Progress ---------- */
const STORE='middlec.progress.v1';
let progress={done:{},current:'keyboard'};
try{ const raw=localStorage.getItem(STORE); if(raw) progress=Object.assign(progress,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(progress)); }catch(e){} }

/* ---------- Piano UI ---------- */
const piano=document.getElementById('piano'); const keyEls=new Map();
const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16,"'":17};
let octaveBase=N('C4');
function buildPiano(){
  piano.innerHTML=''; keyEls.clear(); let whiteIdx=0;
  for(let m=LOW;m<=HIGH;m++){
    const el=document.createElement('div'); el.className='key'+(isBlack(m)?' black':'')+(pc(m)==='C'?' c':''); el.dataset.m=m;
    el.innerHTML=`<span class="kb"></span><span class="nm">${isBlack(m)?'':nameOf(m)}</span>`;
    if(isBlack(m)){ el.style.left=`calc(100%/22*${whiteIdx})`; } else whiteIdx++;
    el.addEventListener('pointerdown',e=>{e.preventDefault(); el.setPointerCapture(e.pointerId); press(m,'mouse');});
    el.addEventListener('pointerup',()=>release(m)); el.addEventListener('pointercancel',()=>release(m));
    piano.appendChild(el); keyEls.set(m,el);
  }
  labelKeys();
}
function labelKeys(){
  keyEls.forEach(el=>el.querySelector('.kb').textContent='');
  Object.entries(KEYMAP).forEach(([k,off])=>{ const el=keyEls.get(octaveBase+off); if(el) el.querySelector('.kb').textContent=k.toUpperCase(); });
}
buildPiano();
document.getElementById('showNames').addEventListener('change',e=>piano.classList.toggle('nonames',!e.target.checked));
const style=document.createElement('style'); style.textContent='.piano.nonames .nm{visibility:hidden}'; document.head.appendChild(style);

const held=new Set();
function press(m,src){
  if(held.has(m)) return; held.add(m); noteOn(m);
  const el=keyEls.get(m); if(el) el.classList.add('down');
  document.getElementById('nowNote').textContent=nameOf(m)+(isBlack(m)?' / '+FLATS[pc(m)]+octv(m):'');
  onNote(m);
}
function release(m){ if(!held.has(m)) return; held.delete(m); noteOff(m); const el=keyEls.get(m); if(el) el.classList.remove('down'); onRelease(m); }
function flash(m,cls){ const el=keyEls.get(m); if(!el) return; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),260); }
window.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.toLowerCase();
  if(e.target.tagName==='INPUT') return;
  if(k==='z'){ octaveBase=Math.max(LOW,octaveBase-12); labelKeys(); toast('Keyboard octave: '+nameOf(octaveBase)+'–'+nameOf(octaveBase+17)); return; }
  if(k==='x'){ octaveBase=Math.min(N('C5'),octaveBase+12); labelKeys(); toast('Keyboard octave: '+nameOf(octaveBase)+'–'+nameOf(octaveBase+17)); return; }
  if(k in KEYMAP){ e.preventDefault(); const m=octaveBase+KEYMAP[k]; if(m<=HIGH) press(m,'kb'); }
});
window.addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(k in KEYMAP) release(octaveBase+KEYMAP[k]); });
window.addEventListener('blur',()=>{ [...held].forEach(release); });
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

function setHints(notes,fingers){
  keyEls.forEach(el=>{ el.classList.remove('hint'); const b=el.querySelector('.fbadge'); if(b) b.remove(); });
  (notes||[]).forEach((m,i)=>{ const el=keyEls.get(m); if(!el) return; el.classList.add('hint'); if(fingers&&fingers[i]){ const b=document.createElement('span'); b.className='fbadge'; b.textContent=fingers[i]; el.appendChild(b);} });
}

/* ---------- Lesson engine ---------- */
const stage=document.getElementById('stage'); const navEl=document.getElementById('nav');
let cur={lesson:null,step:0}; let task=null; let rhythmTimers=[];

function renderNav(){
  navEl.innerHTML=''; let grp='';
  LESSONS.forEach((L,i)=>{
    if(L.group!==grp){ grp=L.group; const s=document.createElement('div'); s.className='sec'; s.textContent=grp; navEl.appendChild(s); }
    const b=document.createElement('button'); const d=progress.done[L.id];
    b.className='lesson'+(cur.lesson===L.id?' active':'')+(d?' is-done':'');
    b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span>${L.title}</span><span class="done">${d?'✓':''}</span>`;
    b.addEventListener('click',()=>{ openLesson(L.id,0); navEl.classList.remove('open'); });
    navEl.appendChild(b);
  });
  const n=Object.keys(progress.done).length; document.getElementById('progText').textContent=`${n} of ${LESSONS.length} lessons`; document.getElementById('progBar').style.width=(100*n/LESSONS.length)+'%';
}
document.getElementById('menuBtn').addEventListener('click',()=>navEl.classList.toggle('open'));
document.getElementById('resetBtn').addEventListener('click',()=>{ if(confirm('Clear all saved lesson progress?')){ progress={done:{},current:'keyboard'}; save(); renderNav(); openLesson('keyboard',0);} });

function openLesson(id,step){
  clearTask(); cur={lesson:id,step}; progress.current=id; save(); renderNav();
  const L=LESSONS.find(l=>l.id===id); const i=LESSONS.indexOf(L); const S=L.steps[step];
  let html=`<div class="eyebrow">Lesson ${i+1} · ${L.group} · step ${step+1} of ${L.steps.length}</div><h2>${L.title}</h2><p class="lede">${L.lede}</p>`;
  if(S.type==='read'){
    html+=`<div class="prose">${S.html}</div><div class="actions"><button class="btn" id="next">Continue</button>${step>0?'<button class="btn alt" id="prev">Back</button>':''}</div>`;
    stage.innerHTML=html; setHints([]); bindNav(L,step);
  } else if(S.type==='song'){
    html+=`<div class="task"><div class="task-head"><div class="title">${S.title}</div><div class="prog" id="tprog"></div></div>
      <div id="staffArea" style="margin-bottom:8px"></div>
      <div class="prompt" style="min-height:70px"><div class="big" id="bigNote"></div><div id="promptText" class="fb" style="margin:0"></div></div>
      <div class="fb" id="fb"></div>
      <div class="actions"><button class="btn alt" id="restart">Start over</button><label style="display:flex;align-items:center;gap:6px;font-size:14px"><input type="checkbox" id="hintToggle" checked> Highlight next key</label><button class="btn alt" id="listen">Listen to it</button></div>
      <div class="actions" id="navActions" style="margin-top:6px"></div></div>`;
    stage.innerHTML=html; startSong(L,step,S);
  } else {
    html+=`<div class="task"><div class="task-head"><div class="title">${S.title}</div><div class="prog" id="tprog"></div></div>
      <p style="margin:0 0 10px;color:var(--ink-2)">${S.prompt}</p>
      <div id="staffArea"></div><div id="beats" class="beats"></div>
      <div class="prompt" id="promptBox"><div class="big" id="bigNote"></div><div id="fingerBox"></div><div class="chips" id="chips"></div></div>
      <div class="fb" id="fb"></div><div class="actions" id="taskActions"></div></div>`;
    stage.innerHTML=html;
    if(S.type==='play') startPlay(L,step,S); else if(S.type==='chord') startChord(L,step,S); else if(S.type==='rhythm') startRhythm(L,step,S);
  }
  stage.parentElement.scrollTop=0;
}
function bindNav(L,step){
  const n=document.getElementById('next'), p=document.getElementById('prev');
  if(n) n.addEventListener('click',()=>advance(L,step));
  if(p) p.addEventListener('click',()=>openLesson(L.id,step-1));
}
function advance(L,step){
  if(step+1<L.steps.length) openLesson(L.id,step+1);
  else { const i=LESSONS.indexOf(L); if(i+1<LESSONS.length) openLesson(LESSONS[i+1].id,0); else { openLesson(L.id,0); toast('You finished every lesson.'); } }
}
function clearTask(){ task=null; setHints([]); rhythmTimers.forEach(clearTimeout); rhythmTimers=[]; }
function finishTask(L,step,score,extra){
  const isLast = step===L.steps.length-1;
  const pct=Math.round(score*100);
  const prev=progress.done[L.id];
  if(isLast){ if(!prev||pct>=prev.score) progress.done[L.id]={score:pct,date:Date.now()}; else progress.done[L.id]=prev; save(); renderNav(); }
  const box=document.getElementById('promptBox')||document.querySelector('.prompt'); setHints([]);
  box.innerHTML=`<div class="result"><div><div class="k">Accuracy</div><div class="v">${pct}%</div></div>${extra||''}</div>`;
  const fb=document.getElementById('fb'); fb.className='fb '+(pct>=80?'good':''); fb.textContent = pct>=90?'Excellent. That is ready to move on.' : pct>=70?'Good — one more pass would make it solid.' : 'Take it again slowly; accuracy first, speed later.';
  const acts=document.getElementById('taskActions')||document.getElementById('navActions'); acts.innerHTML='';
  const again=document.createElement('button'); again.className='btn alt'; again.textContent='Try again'; again.addEventListener('click',()=>openLesson(L.id,step));
  const next=document.createElement('button'); next.className='btn'; next.textContent=isLast?(LESSONS.indexOf(L)+1<LESSONS.length?'Next lesson':'Back to start'):'Continue'; next.addEventListener('click',()=>advance(L,step));
  acts.append(next,again);
  const staff=document.getElementById('staffArea'); if(staff) staff.innerHTML='';
  const beats=document.getElementById('beats'); if(beats) beats.innerHTML='';
}

/* play: sequence of single targets */
function startPlay(L,step,S){
  task={type:'play',L,step,S,idx:0,correct:0,wrong:0}; showPlayTarget();
}
function showPlayTarget(){
  const {S,idx}=task; const t=S.targets[idx]; document.getElementById('tprog').textContent=`${idx+1} / ${S.targets.length}`;
  const big=document.getElementById('bigNote'); const fbx=document.getElementById('fingerBox'); const sa=document.getElementById('staffArea');
  if(S.staff){ sa.innerHTML=`<div class="staff-box">${staffSVG(S.staff,[t.notes[0]],{width:170})}</div>`; big.innerHTML=t.hint?`${nameOf(t.notes[0])}<small>shown while hints are on</small>`:'<span style="color:var(--ink-3)">?</span><small>read the staff</small>'; }
  else { sa.innerHTML=''; big.innerHTML=`${t.label}${t.sub?`<small>${t.sub}</small>`:''}`; }
  fbx.innerHTML=t.finger?`<div class="finger" title="finger ${t.finger}">${t.finger}</div>`:'';
  setHints(t.hint?(t.notes||[]):[], t.finger?[t.finger]:null);
  document.getElementById('fb').textContent='';
}
function matches(t,m){ return t.notes?t.notes.includes(m):(t.pcs.includes(m%12)); }
function onNote(m){
  if(!task) return;
  if(task.type==='play'){
    const t=task.S.targets[task.idx];
    if(matches(t,m)){ task.correct++; flash(m,'ok'); task.idx++; if(task.idx>=task.S.targets.length){ finishTask(task.L,task.step,task.correct/(task.correct+task.wrong)); task=null; } else showPlayTarget(); }
    else { task.wrong++; flash(m,'err'); const fb=document.getElementById('fb'); fb.className='fb bad'; fb.textContent=`That was ${nameOf(m)}${isBlack(m)?' ('+FLATS[pc(m)]+')':''}. ${t.label?'Looking for '+t.label:'Try again'}.`; }
  } else if(task.type==='chord'){
    const t=task.S.targets[task.idx]; if(task.waitRelease) return;
    if(!t.notes.includes(m)){ task.wrong++; flash(m,'err'); const fb=document.getElementById('fb'); fb.className='fb bad'; fb.textContent=`${nameOf(m)} isn't in ${t.label} major (${t.sub}).`; return; }
    renderChips();
    if(t.notes.every(n=>held.has(n))){ task.correct++; t.notes.forEach(n=>flash(n,'ok')); task.waitRelease=true; const fb=document.getElementById('fb'); fb.className='fb good'; fb.textContent=t.label+' major — release the keys for the next one.'; }
  } else if(task.type==='rhythm'){
    if(!task.started) return; const now=performance.now(); const tol=180;
    let best=-1,bd=1e9; task.expect.forEach((e,i)=>{ if(task.hits[i]) return; const d=Math.abs(now-e); if(d<bd){bd=d;best=i;} });
    if(best>=0&&bd<=tol){ task.hits[best]=true; task.correct++; markBeat(best,'hit'); } else { task.wrong++; flash(m,'err'); }
  } else if(task.type==='song'){
    const n=task.notes[task.idx];
    if(m===n.n){ task.correct++; flash(m,'ok'); task.idx++; if(task.idx>=task.notes.length){ finishTask(task.L,task.step,task.correct/(task.correct+task.wrong)); task=null; } else showSongNote(); }
    else { task.wrong++; flash(m,'err'); const fb=document.getElementById('fb'); fb.className='fb bad'; fb.textContent=`That was ${nameOf(m)} — next note is ${nameOf(n.n)}.`; }
  }
}
function onRelease(m){
  if(task&&task.type==='chord'){ renderChips(); if(task.waitRelease&&held.size===0){ task.waitRelease=false; task.idx++; if(task.idx>=task.S.targets.length){ finishTask(task.L,task.step,task.correct/(task.correct+task.wrong)); task=null; } else showChordTarget(); } }
}

/* chord */
function startChord(L,step,S){ task={type:'chord',L,step,S,idx:0,correct:0,wrong:0,waitRelease:false}; showChordTarget(); }
function showChordTarget(){
  const {S,idx}=task; const t=S.targets[idx]; document.getElementById('tprog').textContent=`${idx+1} / ${S.targets.length}`;
  document.getElementById('bigNote').innerHTML=`${t.label}<small>${t.label} major · ${t.sub}</small>`;
  document.getElementById('fingerBox').innerHTML='<div style="display:flex;gap:6px"><div class="finger">1</div><div class="finger">3</div><div class="finger">5</div></div>';
  document.getElementById('staffArea').innerHTML=`<div class="staff-box">${staffSVG('treble',t.notes,{width:180})}</div>`;
  setHints(t.hint?t.notes:[], t.hint?[1,3,5]:null); document.getElementById('fb').textContent=''; renderChips();
}
function renderChips(){ const t=task.S.targets[task.idx]; document.getElementById('chips').innerHTML=t.notes.map(n=>`<span class="chip ${held.has(n)?'on':''}">${nameOf(n)}</span>`).join(''); }

/* rhythm */
function startRhythm(L,step,S){
  task={type:'rhythm',L,step,S,correct:0,wrong:0,started:false,hits:[],expect:[]};
  const beats=document.getElementById('beats'); beats.innerHTML=S.pattern.map((d,i)=>`<div class="beat ${d===2?'half':''}" id="b${i}">${d===2?'2':'1'}</div>`).join('');
  document.getElementById('bigNote').innerHTML=`<small>${S.bpm} beats per minute</small>`;
  document.getElementById('tprog').textContent=`${S.pattern.length} beats`;
  const acts=document.getElementById('taskActions'); acts.innerHTML='<button class="btn" id="go">Start count-in</button>';
  document.getElementById('go').addEventListener('click',()=>{ acts.innerHTML=''; runRhythm(); });
}
function markBeat(i,cls){ const el=document.getElementById('b'+i); if(el){ el.classList.remove('now'); el.classList.add(cls);} }
function runRhythm(){
  audio(); const S=task.S; const beat=60000/S.bpm; const start=performance.now()+300; const fb=document.getElementById('fb'); fb.className='fb';
  for(let i=0;i<4;i++){ rhythmTimers.push(setTimeout(()=>{ click(i===0); fb.textContent='Count-in: '+(i+1); },start+i*beat-performance.now())); }
  let t=start+4*beat; task.expect=[]; S.pattern.forEach((d,i)=>{ const at=t; task.expect.push(at); task.hits.push(false);
    rhythmTimers.push(setTimeout(()=>{ click(i%4===0); document.getElementById('b'+i)?.classList.add('now'); fb.textContent='Play!'; },at-performance.now()));
    for(let k=1;k<d;k++) rhythmTimers.push(setTimeout(()=>click(false),at+k*beat-performance.now()));
    t+=d*beat; });
  rhythmTimers.push(setTimeout(()=>{ task.started=true; },start+4*beat-200-performance.now()));
  rhythmTimers.push(setTimeout(()=>{ task.hits.forEach((h,i)=>{ if(!h) markBeat(i,'miss'); }); const missed=task.hits.filter(h=>!h).length; const total=S.pattern.length; const score=Math.max(0,(task.correct-task.wrong*0.5))/total; task.wrong+=missed; finishTask(task.L,task.step,Math.min(1,score),`<div><div class="k">On the beat</div><div class="v">${task.correct}/${total}</div></div>`); task=null; },t+400-performance.now()));
}

/* song */
function startSong(L,step,S){
  const song=SONGS[S.song]; task={type:'song',L,step,S,notes:song.notes,idx:0,correct:0,wrong:0,hint:true,song};
  document.getElementById('restart').addEventListener('click',()=>openLesson(L.id,step));
  document.getElementById('hintToggle').addEventListener('change',e=>{ if(task){ task.hint=e.target.checked; showSongNote(); } });
  document.getElementById('listen').addEventListener('click',()=>playback(song));
  const nav=document.getElementById('navActions'); nav.innerHTML='';
  const skip=document.createElement('button'); skip.className='ghost'; skip.textContent=step+1<L.steps.length?'Skip to next song':'Back to lesson list'; skip.addEventListener('click',()=>advance(L,step)); nav.appendChild(skip);
  showSongNote();
}
function showSongNote(){
  const {notes,idx,hint}=task; const n=notes[idx]; document.getElementById('tprog').textContent=`${idx+1} / ${notes.length}`;
  const from=Math.max(0,idx-2), win=notes.slice(from,from+8);
  document.getElementById('staffArea').innerHTML=`<div class="staff-box">${staffSVG('treble',win.map(x=>x.n),{width:Math.min(560,90+win.length*58),cursor:idx-from,labels:win.map(x=>x.d>1?x.d+' beats':(x.d<1?'½':''))})}</div>`;
  document.getElementById('bigNote').innerHTML=hint?`${pc(n.n)}<small>${n.d===1?'1 beat':n.d+' beats'}</small>`:`<span style="color:var(--ink-3)">?</span><small>read the staff</small>`;
  document.getElementById('promptText').textContent=idx===0?'Play the first note when you\'re ready.':'';
  setHints(hint?[n.n]:[]); document.getElementById('fb').textContent='';
}
function playback(song){
  audio(); const beat=60000/song.bpm; let t=0; clearTask(); document.getElementById('fb').textContent='Listen…';
  song.notes.forEach(n=>{ rhythmTimers.push(setTimeout(()=>{ noteOn(n.n,0.6); flash(n.n,'ok'); },t)); rhythmTimers.push(setTimeout(()=>noteOff(n.n),t+n.d*beat*0.9)); t+=n.d*beat; });
  rhythmTimers.push(setTimeout(()=>{ const L=LESSONS.find(l=>l.id===cur.lesson); openLesson(L.id,cur.step); },t+400));
}

/* ---------- Boot ---------- */
renderNav();
const startId = LESSONS.some(l=>l.id===progress.current)?progress.current:'keyboard';
openLesson(startId,0);
</script>
</body>
